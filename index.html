<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSR | تحميل هك دلتا للايفون</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #0b0713;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(25, 15, 35, 0.8);
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #a855f7;
            letter-spacing: 2px;
        }
        .main-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: rgba(26, 18, 38, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .image-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 20px;
            background: #150b24;
            border: 2px dashed #a855f7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a855f7;
            font-size: 14px;
        }
        .image-placeholder img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #e2e8f0;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            transition: 0.3s;
        }
        .btn-download:hover {
            opacity: 0.9;
        }
        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- الشريط العلوي -->
        <header>
            <div class="logo">KSR</div>
            <div>📱</div>
        </header>

        <!-- قسم الهك الأساسي -->
        <div class="card">
            <div class="image-placeholder">
                <span>ضع صورتك هنا</span>
                <!-- <img src="رابط_صورتك.png" alt="Delta"> -->
            </div>
            <h1>تحميل هك دلتا للايفون</h1>
            <p>قم بتثبيت التطبيق مباشرة بكل سهولة واستمتع بالخصائص المتقدمة.</p>
            
            <!-- زر التثبيت اليدوي المباشر -->
            <a href="itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist" class="btn-download">
                تثبيت مباشر 📥
            </a>
        </div>

        <!-- قسم الموثوقية والأمان -->
        <div class="card">
            <div style="font-size: 30px; margin-bottom: 10px;">🛡️</div>
            <h1>تطبيقات آمنة وموثوقة</h1>
            <p>نسخ خالية من المشاكل ومجهزة بعناية لتجربة سلسة ومستقرة.</p>
        </div>

        <!-- حقوق النشر -->
        <footer>
            جميع الحقوق محفوظة © KSR 2026
        </footer>
    </div>

</body>
</html>
