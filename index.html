<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSR Store | منصة الأدوات والتحميل</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #090a0f;
            background-image: radial-gradient(circle at top, #1a1c29 0%, #090a0f 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* شاشة ترحيبية أنيقة بدلاً من القديمة */
        #loader {
            position: fixed;
            inset: 0;
            background: #090a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader-brand {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin-top: 10px;
        }

        /* نافذة الهيدر بتصميم مختلف تماماً */
        .header-box {
            background: rgba(25, 28, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header-title {
            font-weight: 700;
            font-size: 18px;
            color: #38bdf8;
        }

        /* البطاقة الرئيسية بهيكل جديد وحواف دائرية مختلفة */
        .main-card {
            background: rgba(18, 20, 32, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .preview-img-box {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            background: #0f111a;
        }

        .preview-img-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .section-heading {
            font-size: 17px;
            color: #e2e8f0;
            margin-bottom: 14px;
            font-weight: 600;
            text-align: right;
        }

        /* قائمة المميزات بتصميم شبكي وعلامات مميزة */
        .features-grid {
            list-style: none;
            margin-bottom: 20px;
        }

        .features-grid li {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .features-grid li span {
            color: #38bdf8;
            font-size: 12px;
        }

        /* شارة الحالة بتصميم عصري صغير */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .status-pill::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }

        /* أزرار التحميل بتدرجات لقمة الاحترافية */
        .action-button {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            transition: transform 0.2s, opacity 0.2s;
            border: none;
        }

        .action-button.alt {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .action-button:active {
            transform: scale(0.97);
        }

        .discord-box {
            background: rgba(18, 20, 32, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
        }

        .discord-link {
            display: inline-block;
            margin-top: 8px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .discord-link:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-brand">KSR Hub</div>
    </div>

    <div class="container">
        
        <div class="header-box">
            <div class="header-title">KSR Dashboard</div>
            <div style="font-size: 14px; color: #94a3b8;">v2.5</div>
        </div>

        <div class="main-card">
            <div class="preview-img-box">
                <img src="https://i.ibb.co/3m12345/delta.png" alt="Delta" id="toolImg">
            </div>

            <div class="section-heading">مميزات النسخة</div>

            <ul class="features-grid">
                <li>من اقوى الهاكات حمايةً <span>✦</span></li>
                <li>سهولة الحصول على المفتاح <span>✦</span></li>
                <li>يمكنك بحث السكريبتات فيه <span>✦</span></li>
            </ul>

            <div>
                <div class="status-pill">حالة الأداة: تعمل بكفاءة</div>
            </div>

            <a href="itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist" class="action-button">
        
             (تحميل)
            </a>
            
            <a href="itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist" class="action-button alt">
                تحميل احتياطي (بديل) 
            </a>
        </div>

        <div class="discord-box">
            <h3 style="font-size: 15px; color: #f8fafc; margin-bottom: 4px;">مجتمع الديسكورد</h3>
            <p style="font-size: 12px; color: #94a3b8;">تابع آخر التحديثات والأخبار أول بأول.</p>
            <a href="https://discord.gg/4nn9R3SSF" target="_blank" class="discord-link">discord.gg/4nn9R3SSF</a>
        </div>

        <footer>
            جميع الحقوق محفوظة © KSR 2026
        </footer>
    </div>

    <script>
        // إخفاء شاشة التحميل بعد ثانية
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }, 1000);

        // بديل تلقائي للصورة
        const fallbackCanvas = document.createElement('canvas');
        fallbackCanvas.width = 400; fallbackCanvas.height = 200;
        const ctx = fallbackCanvas.getContext('2d');
        ctx.fillStyle = '#0f111a';
        ctx.fillRect(0, 0, 400, 200);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 20px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('Delta Executor PRO', 200, 105);
        
        document.getElementById('toolImg').onerror = function() {
            this.src = fallbackCanvas.toDataURL();
        };
    </script>
</body>
</html>
