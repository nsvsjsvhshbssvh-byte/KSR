<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSR | تحميل هاك دلتا للايفون</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }

        /* خلفية متحركة بالأسود والأخضر */
        body {
            background: linear-gradient(135deg, #050b07, #022b12, #000000);
            background-size: 400% 400%;
            animation: gradientAnimation 10s ease infinite;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* شاشة الترحيب بالشعار */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 1s ease 2s forwards;
            pointer-events: none;
        }

        #splash-screen h1 {
            font-size: 45px;
            color: #22c55e;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(5, 20, 10, 0.8);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #22c55e;
            letter-spacing: 2px;
        }

        .welcome-text {
            font-size: 18px;
            color: #4ade80;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .main-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: rgba(10, 25, 15, 0.85);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        .image-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 20px;
            background: #051208;
            border: 2px solid #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: 0.3s;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- شاشة البداية بالشعار -->
    <div id="splash-screen">
        <h1>KSR</h1>
    </div>

    <div class="main-container">
        <!-- الشريط العلوي -->
        <header>
            <div class="logo">KSR</div>
            <div>📱</div>
        </header>

        <!-- نص الترحيب -->
        <div class="welcome-text">
            حياك الله في هكات : KSR
        </div>

        <!-- قسم هاك دلتا -->
        <div class="card">
            <div class="image-container">
                <!-- صورة دلتا المطلوبة -->
                <img src="https://i.ibb.co/3m12345/delta.png" alt="Delta Hacker" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'120\' height=\'120\'><rect width=\'100%\' height=\'100%\' fill=\'%23051208\'/><text x=\'50%\' y=\'50%\' fill=\'%2322c55e\' font-size=\'14\' text-anchor=\'middle\' dominant-baseline=\'middle\'>صورة دلتا</text></svg>'">
            </div>
            <h2>تحميل هاك دلتا للايفون</h2>
            <p>قم بتثبيت التطبيق مباشرة بكل سهولة واستمتع بالخصائص المتقدمة.</p>
            
            <!-- زر التحميل بدون إيموجي -->
            <a href="itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist" class="btn-download">
                تحميل
            </a>
        </div>

        <!-- قسم الموثوقية والأمان -->
        <div class="card">
            <h2>تطبيقات آمنة وموثوقة</h2>
            <p>نسخ خالية من المشاكل ومجهزة بعناية لتجربة سلسة ومستقرة.</p>
        </div>

        <!-- حقوق النشر -->
        <footer>
            جميع الحقوق محفوظة © KSR 2026
        </footer>
    </div>

</body>
</html>
