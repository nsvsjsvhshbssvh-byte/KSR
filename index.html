<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSR | مركز التحميل الرسمي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: #030704;
            background-image: radial-gradient(circle at 50% 50%, #062410 0%, #010d05 70%);
            background-size: 100% 100%;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #010d05;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.8s ease 1.5s forwards;
            pointer-events: none;
        }

        #splash-screen h1 {
            font-size: 40px;
            color: #4ade80;
            letter-spacing: 5px;
            text-shadow: 0 0 25px rgba(74, 222, 128, 0.5);
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 22px;
            background: rgba(4, 18, 9, 0.95);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 14px;
            margin-bottom: 25px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            font-size: 20px;
            font-weight: bold;
            color: #4ade80;
            letter-spacing: 3px;
        }

        .wrapper {
            max-width: 480px;
            margin: 0 auto;
        }

        .panel-box {
            background: rgba(6, 22, 12, 0.9);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
        }

        .media-holder {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(74, 222, 128, 0.3);
            margin-bottom: 18px;
            background: #020f06;
        }

        .media-holder img {
            width: 100%;
            height: auto;
            display: block;
        }

        .box-heading {
            font-size: 19px;
            color: #38bdf8;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .info-list {
            list-style: none;
            margin-bottom: 22px;
            text-align: right;
            padding: 0 5px;
        }

        .info-list li {
            font-size: 14px;
            color: #e2e8f0;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 8px;
        }

        .info-list li::after {
            content: "◆";
            color: #38bdf8;
            font-size: 11px;
        }

        .state-indicator {
            display: inline-block;
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 6px 25px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 18px;
            background: rgba(74, 222, 128, 0.08);
        }

        .main-action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #6d28d9, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.35);
            border: 1px solid rgba(167, 139, 250, 0.4);
            transition: 0.2s;
        }

        .main-action-btn:active {
            transform: scale(0.98);
        }

        .community-url {
            display: block;
            margin-top: 12px;
            color: #4ade80;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .community-url:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 25px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1>KSR</h1>
    </div>

    <div class="top-nav">
        <div class="brand-logo">KSR</div>
        <div>🛡️</div>
    </div>

    <div class="wrapper">
        
        <div class="panel-box">
            <div class="media-holder">
                <img src="https://i.ibb.co/3m12345/delta.png" alt="Delta" id="customImg">
            </div>

            <div class="box-heading">مميزات هاك دلتا</div>

            <ul class="info-list">
                <li>من اقوى الهاكات حمايةً</li>
                <li>سهولة الحصول على المفتاح</li>
                <li>يمكنك بحث السكريبتات فيه</li>
            </ul>

            <div>
                <span class="state-indicator">يعمل ✓</span>
            </div>

            <a href="itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist" class="main-action-btn">
                تحميل مباشر 📥
            </a>
            
            <a href="itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist" class="main-action-btn" style="background: linear-gradient(135deg, #5b21b6, #7c3aed);">
                نسخة احتياطية 📥
            </a>
        </div>

        <div class="panel-box">
            <h2 style="font-size: 16px; margin-bottom: 6px; color: #ffffff;">سيرفر الديسكورد</h2>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">انضم إلينا للمزيد من التحديثات والأدوات الحصرية.</p>
            <a href="https://discord.gg/4nn9R3SSF" target="_blank" class="community-url">https://discord.gg/4nn9R3SSF</a>
        </div>

        <footer>
            جميع الحقوق محفوظة © KSR 2026
        </footer>
    </div>

    <script>
        const canvas = document.createElement('canvas');
        canvas.width = 400; canvas.height = 200;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#020f06';
        ctx.fillRect(0, 0, 400, 200);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 22px Tahoma';
        ctx.textAlign = 'center';
        ctx.fillText('Delta Executor', 200, 105);
        
        const imgElement = document.getElementById('customImg');
        imgElement.onerror = function() {
            this.src = canvas.toDataURL();
        };
    </script>
</body>
</html>
